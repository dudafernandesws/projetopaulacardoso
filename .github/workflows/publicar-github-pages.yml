name: Publicar no GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v6

      - name: Validar os arquivos
        run: npm run check

      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar os arquivos do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/web

      - name: Publicar o site
        id: publicacao
        uses: actions/deploy-pages@v4
